# Keeps the SHA-pinned GitHub Actions and Go modules current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wails is upgraded by hand, as its own change: its releases include
    # nightly builds, and an upgrade needs the bindings regenerated.
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
