name: Image tools

# Weekly check of the tool versions the PHP images pin (Composer, PHPUnit,
# PHP_CodeSniffer, moodle-cs and its standards): fails when a tool has a
# newer release at least 14 days old, so it can be pinned in a release.
# It changes nothing.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

# Nothing by default: the job only reads the repository.
permissions: {}

jobs:
  check:
    name: Check the pinned tool versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Pinned by commit SHA; Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compare with the newest releases
        run: go run ./tools/imagetools
