name: Pages

# Rebuilds the apt/dnf package repository on GitHub Pages from the packages
# of the three latest releases of each app, signed with the repository key.
# The release workflow calls it after each release; it also runs by hand
# (Actions → Pages → Run workflow) to rebuild the site from main.
on:
  workflow_call:
  workflow_dispatch:

# Nothing by default: the job asks only for what it needs.
permissions: {}

jobs:
  pages:
    name: Publish the package repository
    runs-on: ubuntu-24.04
    # Runs of different releases publish one after the other.
    concurrency:
      group: pages
      cancel-in-progress: false
    # Only this job, in the github-pages environment, gets the key.
    environment:
      name: github-pages
      url: https://oito2.github.io/perci82/
    permissions:
      contents: read  # read the releases and check out the scripts
      pages: write    # deploy the site
      id-token: write # authenticate the deployment

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm

      # The three newest releases of each app; releases without packages
      # (before 1.2.0) are skipped by build-pages.sh.
      - name: Download the packages of the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(gh release list -R "$REPO" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          for app in system dev; do
            for tag in $(grep -E "^${app}-v[0-9]+\.[0-9]+\.[0-9]+$" <<<"$tags" | sort -V | tail -n 3); do
              gh release download "$tag" -R "$REPO" -D "$RUNNER_TEMP/packages/$tag" -p '*.deb' -p '*.rpm' -p checksums.txt
            done
          done

      - name: Import the signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          gnupg="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$gnupg"
          printf '%s\n' "$REPO_SIGNING_PASSPHRASE" | head -n 1 > "$RUNNER_TEMP/passphrase"
          chmod 600 "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$REPO_SIGNING_KEY" | GNUPGHOME="$gnupg" gpg --batch --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/passphrase" --import
          echo "GNUPGHOME=$gnupg" >> "$GITHUB_ENV"
          echo "REPO_PASSPHRASE_FILE=$RUNNER_TEMP/passphrase" >> "$GITHUB_ENV"

      - name: Build the site
        run: scripts/build-pages.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/packages"

      - name: Upload the site
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      # Pages keeps the first deployment of a build version and ignores the
      # next ones, and deploy-pages always uses the commit SHA, which two
      # releases tagged on the same commit share. Each run deploys with its
      # own build version through the Pages API instead.
      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$oidc"
          id=$(jq -n --arg a "$ARTIFACT_ID" --arg v "$BUILD_VERSION" --arg t "$oidc" \
            '{artifact_id: ($a | tonumber), pages_build_version: $v, oidc_token: $t}' |
            gh api -X POST "repos/$REPO/pages/deployments" --input - --jq '.id // (.status_url | split("/") | last)')
          echo "Deployment $id of $BUILD_VERSION"
          for _ in $(seq 1 120); do
            sleep 5
            status=$(gh api "repos/$REPO/pages/deployments/$id" --jq .status) || continue
            echo "Status: $status"
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed | deployment_content_failed | deployment_cancelled | deployment_lost) exit 1 ;;
            esac
          done
          echo "::error::The Pages deployment didn't finish in 10 minutes"
          gh api -X POST "repos/$REPO/pages/deployments/$id/cancel" || true
          exit 1
