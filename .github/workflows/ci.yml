name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow as its gate.
  workflow_call:

# Nothing by default: the job only reads the repository.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Pinned by commit SHA; Dependabot keeps them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies (Wails/GUI — cgo, GTK4/WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Check gofmt
        run: gofmt -l . | (! grep .)

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run

      - name: Check generated files
        run: make check-generated

      # The wails3 CLI is the Wails module version go.mod pins.
      - name: Check the generated bindings
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          PATH="$(go env GOPATH)/bin:$PATH" make check-bindings

      # ShellCheck comes with the runner; shfmt is pinned.
      - name: Lint the installers
        run: |
          shellcheck --version
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          make lint-shell

      - name: Run tests
        run: go test -race ./...

      - name: Build both applications
        run: make build

      # The .deb and .rpm packages of both apps (nfpm at the version the
      # Makefile pins), shown for review.
      - name: Build and show the packages
        run: |
          sudo apt-get install -y rpm createrepo-c
          make install-nfpm
          PATH="$(go env GOPATH)/bin:$PATH" make release VERSION=v0.0.0 DIST="$RUNNER_TEMP/dist"
          for f in "$RUNNER_TEMP"/dist/*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          for f in "$RUNNER_TEMP"/dist/*.rpm; do rpm -qip "$f"; rpm -qp --requires "$f"; rpm -qlp "$f"; done

      # The package repository site, built as the release does but signed
      # with a throwaway key: the real key exists only in the release's
      # github-pages environment.
      - name: Build the package repository with a throwaway key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          echo ci > "$RUNNER_TEMP/passphrase"
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --quick-gen-key "Perci82 CI throwaway key" rsa3072 sign 1d
          gpg --armor --export > "$RUNNER_TEMP/throwaway.asc"
          for app in system dev; do
            dir="$RUNNER_TEMP/packages/$app-v0.0.0"
            mkdir -p "$dir"
            cp "$RUNNER_TEMP"/dist/perci82-"$app"_0.0.0-1_amd64.deb "$RUNNER_TEMP"/dist/perci82-"$app"-0.0.0-1.x86_64.rpm "$dir"/
            grep -E "  perci82-$app[_-]0\.0\.0-1" "$RUNNER_TEMP/dist/checksums.txt" > "$dir/checksums.txt"
          done
          REPO_PUBLIC_KEY="$RUNNER_TEMP/throwaway.asc" REPO_PASSPHRASE_FILE="$RUNNER_TEMP/passphrase" \
            scripts/build-pages.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/packages"
          find "$RUNNER_TEMP/site" -type f | sort

      # The runner's preinstalled Node — the suite needs nothing else.
      - name: Frontend smoke test
        run: |
          node --version
          make test-frontend
