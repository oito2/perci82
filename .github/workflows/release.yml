name: Release

# Each application is released on its own: a system-vX.Y.Z tag publishes
# Perci82 System, a dev-vX.Y.Z tag publishes Perci82 Dev.
on:
  push:
    tags:
      - 'system-v*'
      - 'dev-v*'

# Nothing by default: each job asks only for what it needs. The job that runs
# third-party tooling (apt, go install, lint, tests, build) never holds a
# token that can write to the repository or its releases.
permissions: {}

jobs:
  # The same checks as the CI workflow (lint, tests, build), run before
  # anything is built: the job that produces the attested artifacts never
  # installs the lint tooling.
  test:
    name: Lint and test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      app: ${{ steps.tag.outputs.app }}
      short: ${{ steps.tag.outputs.short }}
      title: ${{ steps.tag.outputs.title }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      # Actions are pinned by commit SHA (tags are mutable); Dependabot keeps
      # them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main — refusing to publish."
            exit 1
          fi

      # system-v1.2.3 -> app perci82-system, version v1.2.3 (the version the
      # binary reports has no application prefix).
      - name: Parse the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            system-v*) short=system; title="Perci82 System" ;;
            dev-v*)    short=dev;    title="Perci82 Dev" ;;
            *) echo "::error::Unknown tag ${TAG}"; exit 1 ;;
          esac
          app="perci82-$short"
          version="${TAG#"$short"-}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${TAG} is not <app>-vX.Y.Z"
            exit 1
          fi
          {
            echo "app=$app"
            echo "short=$short"
            echo "title=$title"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies (Wails/GUI — cgo, GTK4/WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build release artifacts
        env:
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: make "release-${APP#perci82-}" VERSION="$VERSION"

      # The release notes: the install instructions, then the CHANGELOG.md
      # section of this version ("## [System 1.2.3] - date" for
      # system-v1.2.3). A tag without its CHANGELOG section fails here,
      # before anything is published.
      - name: Write the release notes
        env:
          APP: ${{ steps.tag.outputs.app }}
          SHORT: ${{ steps.tag.outputs.short }}
          TITLE: ${{ steps.tag.outputs.title }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          heading="## [${TITLE#Perci82 } ${VERSION#v}]"
          section=$(awk -v h="$heading" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "${section//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no '${heading}' section"
            exit 1
          fi
          {
            echo "## ${TITLE} ${VERSION}"
            echo
            echo "Linux amd64 only: the app uses Wails v3 with cgo (GTK 4/WebKitGTK 6.0)."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 600 -fsSL https://raw.githubusercontent.com/oito2/perci82/main/install-${SHORT}.sh | bash"
            echo '```'
            echo
            echo "The installer downloads the newest ${TITLE} release, checks its checksum (and its attestation, when the GitHub CLI is logged in), adds the application menu entry and offers to remove the old Perci, keeping the settings in \`~/.perci\`."
            echo
            echo "### Manual install"
            echo
            echo "Download \`${APP}-linux-amd64\` and \`checksums.txt\`, check the checksum and install:"
            echo
            echo '```bash'
            echo "sha256sum --ignore-missing -c checksums.txt"
            echo "sudo install -m 755 -o root -g root ${APP}-linux-amd64 /usr/local/bin/${APP}"
            echo '```'
            echo
            echo "### Verify the provenance"
            echo
            echo "The files of this release have a build provenance attestation (SLSA), made by this workflow:"
            echo
            echo '```bash'
            echo "gh attestation verify ${APP}-linux-amd64 --repo oito2/perci82"
            echo '```'
            echo
            echo "### Changes"
            printf '%s\n' "$section" | sed 's/^### /#### /'
          } > dist/release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/${{ steps.tag.outputs.app }}-linux-amd64
            dist/${{ steps.tag.outputs.app }}-menu.tar.gz
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # Sigstore certificate for the attestation
      attestations: write # store the attestation

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ needs.build.outputs.app }}-linux-amd64
            dist/${{ needs.build.outputs.app }}-menu.tar.gz
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.build.outputs.title }} ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/${{ needs.build.outputs.app }}-linux-amd64
            dist/${{ needs.build.outputs.app }}-menu.tar.gz
            dist/checksums.txt
          body_path: dist/release-notes.md
