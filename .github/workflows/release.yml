name: Release

# Each application is released on its own: a system-vX.Y.Z tag publishes
# Perci82 System, a dev-vX.Y.Z tag publishes Perci82 Dev.
on:
  push:
    tags:
      - 'system-v*'
      - 'dev-v*'

# Nothing by default: each job asks only for what it needs. The job that runs
# third-party tooling (apt, go install, lint, tests, build) never holds a
# token that can write to the repository or its releases.
permissions: {}

jobs:
  # The same checks as the CI workflow (lint, tests, build), run before
  # anything is built: the job that produces the attested artifacts never
  # installs the lint tooling.
  test:
    name: Lint and test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      app: ${{ steps.tag.outputs.app }}
      short: ${{ steps.tag.outputs.short }}
      title: ${{ steps.tag.outputs.title }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      # Actions are pinned by commit SHA (tags are mutable); Dependabot keeps
      # them current.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main — refusing to publish."
            exit 1
          fi

      # system-v1.2.3 -> app perci82-system, version v1.2.3 (the version the
      # binary reports has no application prefix).
      - name: Parse the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            system-v*) short=system; title="Perci82 System" ;;
            dev-v*)    short=dev;    title="Perci82 Dev" ;;
            *) echo "::error::Unknown tag ${TAG}"; exit 1 ;;
          esac
          app="perci82-$short"
          version="${TAG#"$short"-}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${TAG} is not <app>-vX.Y.Z"
            exit 1
          fi
          {
            echo "app=$app"
            echo "short=$short"
            echo "title=$title"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install system dependencies (Wails/GUI — cgo, GTK4/WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev rpm

      # The .deb and .rpm packages, built by nfpm at the version the
      # Makefile pins.
      - name: Build the packages
        env:
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          make install-nfpm
          PATH="$(go env GOPATH)/bin:$PATH" make "release-${APP#perci82-}" VERSION="$VERSION"

      - name: Show the packages
        env:
          APP: ${{ steps.tag.outputs.app }}
        run: |
          for f in dist/"$APP"_*.deb; do dpkg-deb --info "$f"; dpkg-deb --contents "$f"; done
          for f in dist/"$APP"-[0-9]*.rpm; do rpm -qip "$f"; rpm -qp --requires "$f"; rpm -qlp "$f"; done

      # The release notes: the install instructions, then the CHANGELOG.md
      # section of this version ("## [System 1.2.3] - date" for
      # system-v1.2.3). A tag without its CHANGELOG section fails here,
      # before anything is published.
      - name: Write the release notes
        env:
          APP: ${{ steps.tag.outputs.app }}
          SHORT: ${{ steps.tag.outputs.short }}
          TITLE: ${{ steps.tag.outputs.title }}
          VERSION: ${{ steps.tag.outputs.version }}
          PAGES_URL: https://oito2.github.io/perci82/
        run: |
          heading="## [${TITLE#Perci82 } ${VERSION#v}]"
          section=$(awk -v h="$heading" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "${section//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no '${heading}' section"
            exit 1
          fi
          deb="${APP}_${VERSION#v}-1_amd64.deb"
          rpm="${APP}-${VERSION#v}-1.x86_64.rpm"
          {
            echo "## ${TITLE} ${VERSION}"
            echo
            echo "Linux amd64 only (the app uses Wails v3 with GTK 4/WebKitGTK 6.0): Debian 13, Ubuntu 24.04, Linux Mint 22, Fedora 40 or newer."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/oito2/perci82/main/install.sh | bash -s -- ${SHORT}"
            echo '```'
            echo
            echo "The script adds the signed Perci82 package repository (apt or dnf, ${PAGES_URL}) and installs ${TITLE}; updates then come with \`apt upgrade\` or \`dnf upgrade\`. Without \`-s -- ${SHORT}\` it asks which apps to install."
            echo
            echo "### Manual install"
            echo
            echo "Download the package and \`checksums.txt\`, check the checksum and install:"
            echo
            echo '```bash'
            echo "sha256sum --ignore-missing -c checksums.txt"
            echo "sudo apt install ./${deb}   # Debian, Ubuntu, Linux Mint"
            echo "sudo dnf install ./${rpm}   # Fedora"
            echo '```'
            echo
            echo "A package installed this way isn't updated by \`apt upgrade\`/\`dnf upgrade\`: add the repository for that."
            echo
            echo "### Verify the provenance"
            echo
            echo "The files of this release have a build provenance attestation (SLSA), made by this workflow:"
            echo
            echo '```bash'
            echo "gh attestation verify ${deb} --repo oito2/perci82"
            echo '```'
            echo
            echo "### Changes"
            printf '%s\n' "$section" | sed 's/^### /#### /'
          } > dist/release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/${{ steps.tag.outputs.app }}_*.deb
            dist/${{ steps.tag.outputs.app }}-[0-9]*.rpm
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # Sigstore certificate for the attestation
      attestations: write # store the attestation

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ needs.build.outputs.app }}_*.deb
            dist/${{ needs.build.outputs.app }}-[0-9]*.rpm
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.build.outputs.title }} ${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/${{ needs.build.outputs.app }}_*.deb
            dist/${{ needs.build.outputs.app }}-[0-9]*.rpm
            dist/checksums.txt
          body_path: dist/release-notes.md

  # The apt/dnf package repository on GitHub Pages, rebuilt from the
  # packages of the latest releases of both apps and signed with the
  # repository key. Only this job, in the github-pages environment, gets
  # the key; runs of different tags publish one after the other.
  pages:
    name: Publish the package repository
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read  # read the releases and check out the scripts
      pages: write    # deploy the site
      id-token: write # authenticate the deployment

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm

      # The three newest releases of each app; releases without packages
      # (before 1.2.0) are skipped by build-pages.sh.
      - name: Download the packages of the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(gh release list -R "$REPO" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          for app in system dev; do
            for tag in $(grep -E "^${app}-v[0-9]+\.[0-9]+\.[0-9]+$" <<<"$tags" | sort -V | tail -n 3); do
              gh release download "$tag" -R "$REPO" -D "$RUNNER_TEMP/packages/$tag" -p '*.deb' -p '*.rpm' -p checksums.txt
            done
          done

      - name: Import the signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          gnupg="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$gnupg"
          printf '%s\n' "$REPO_SIGNING_PASSPHRASE" | head -n 1 > "$RUNNER_TEMP/passphrase"
          chmod 600 "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$REPO_SIGNING_KEY" | GNUPGHOME="$gnupg" gpg --batch --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/passphrase" --import
          echo "GNUPGHOME=$gnupg" >> "$GITHUB_ENV"
          echo "REPO_PASSPHRASE_FILE=$RUNNER_TEMP/passphrase" >> "$GITHUB_ENV"

      - name: Build the site
        run: scripts/build-pages.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/packages"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
